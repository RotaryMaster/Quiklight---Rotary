[package]
name = "quiklight"
version = "0.29.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ashpd = "0.9"
pollster = "0.3"

[target.'cfg(windows)'.dependencies]
scrap = "0.5"
hidapi = "2"
cpal = "0.15"
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
